name: Continuous Integration & Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint with flake8 and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install --no-build-isolation -e .

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings, but enforce rubric PEP8 line length <= 79
        flake8 . --count --max-complexity=10 --max-line-length=79 --statistics

    - name: Run unit tests with pytest
      run: |
        pytest -v

  deploy:
    name: Deploy Application to Cloud Platform
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Trigger Cloud Platform Deployment Hook (Render / Heroku)
      env:
        DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -n "$DEPLOY_HOOK_URL" ]; then
          echo "Triggering cloud deploy hook..."
          curl -s -X POST "$DEPLOY_HOOK_URL"
          echo "Deployment hook triggered successfully."
        else
          echo "RENDER_DEPLOY_HOOK_URL not configured. Skipping webhook trigger."
        fi
