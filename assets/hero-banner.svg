      <circle cx="20" cy="21" r="4.8" fill="#14B8A6">
        <animate attributeName="r" values="3.8;5.8;3.8" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="25.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.2" font-weight="600">1. Train-Only Encoder Fit</text>
    </g>
    <line x1="992" y1="84" x2="992" y2="108" stroke="#14B8A6" stroke-width="1.6" stroke-dasharray="4 3" stroke-opacity="0.7"/>
