      <rect x="0" y="0" width="5" height="42" rx="2.5" fill="#6366F1"/>
      <circle cx="20" cy="21" r="4.8" fill="#6366F1">
        <animate attributeName="r" values="3.8;5.8;3.8" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="25.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.2" font-weight="600">2. RandomForest Classifier</text>
    </g>
    <line x1="992" y1="150" x2="992" y2="174" stroke="#14B8A6" stroke-width="1.6" stroke-dasharray="4 3" stroke-opacity="0.7"/>
    <circle cx="992" cy="150" r="3" fill="#6366F1">
      <animate attributeName="cy" values="150;174" dur="1.4s" begin="0.45s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(834, 174)">
      <rect width="316" height="42" rx="9" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="42" rx="2.5" fill="#14B8A6"/>
      <circle cx="20" cy="21" r="4.8" fill="#14B8A6">
        <animate attributeName="r" values="3.8;5.8;3.8" dur="2.4s" begin="1.0s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="25.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.2" font-weight="600">3. 8-Dim Slice Fairness Audit</text>
    </g>
    <line x1="992" y1="216" x2="992" y2="240" stroke="#14B8A6" stroke-width="1.6" stroke-dasharray="4 3" stroke-opacity="0.7"/>
    <circle cx="992" cy="216" r="3" fill="#6366F1">
      <animate attributeName="cy" values="216;240" dur="1.4s" begin="0.90s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(834, 240)">
      <rect width="316" height="42" rx="9" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="42" rx="2.5" fill="#6366F1"/>
      <circle cx="20" cy="21" r="4.8" fill="#6366F1">
        <animate attributeName="r" values="3.8;5.8;3.8" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="25.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.2" font-weight="600">4. FastAPI + Render Auto-CD</text>
    </g>
</svg>
