<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 328" width="100%" role="img" aria-label="Census Income Classification API">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="328" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="328" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="328" rx="18" fill="url(#glowA)"/>
  <rect width="1200" height="328" rx="18" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="326" rx="17" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="52" y="0" width="220" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Eyebrow Badge -->
  <g transform="translate(52, 28)">
    <rect width="254" height="28" rx="14" fill="#0F766E" fill-opacity="0.28" stroke="#14B8A6" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#6366F1">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.0">REPRODUCIBLE MLOPS PIPELINE</text>
  </g>

  <!-- Left Column: Title, Wrapped Subtitle & Divider (x=52..772) -->
  <text x="52" y="96" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">Census Income Classification API</text>
  <text x="52" y="128" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Leakage-Safe Tabular MLOps</text>
  <text x="52" y="150" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">8-Dimension Subgroup Fairness Audit · FastAPI + Render CD</text>
  <line x1="52" y1="170" x2="772" y2="170" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Left Column: 2x2 Bento Grid of KPI Stat Pills (x=52..772, y=188..294) -->
  
    <g transform="translate(52, 188)">
      <rect width="352" height="47" rx="10" fill="#111827" stroke="#14B8A6" stroke-opacity="0.42" stroke-width="1.2"/>
      <circle cx="18" cy="23.5" r="4.5" fill="#14B8A6">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="18.5" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.7">DATASET</text>
      <text x="34" y="35.5" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">32,562 Rows</text>
    </g>
    <g transform="translate(420, 188)">
      <rect width="352" height="47" rx="10" fill="#111827" stroke="#14B8A6" stroke-opacity="0.42" stroke-width="1.2"/>
      <circle cx="18" cy="23.5" r="4.5" fill="#14B8A6">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="18.5" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.7">PRECISION</text>
      <text x="34" y="35.5" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">0.7875</text>
    </g>
    <g transform="translate(52, 247)">
      <rect width="352" height="47" rx="10" fill="#111827" stroke="#14B8A6" stroke-opacity="0.42" stroke-width="1.2"/>
      <circle cx="18" cy="23.5" r="4.5" fill="#14B8A6">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="18.5" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.7">FAIRNESS</text>
      <text x="34" y="35.5" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">8 Dimensions</text>
    </g>
    <g transform="translate(420, 247)">
      <rect width="352" height="47" rx="10" fill="#111827" stroke="#14B8A6" stroke-opacity="0.42" stroke-width="1.2"/>
      <circle cx="18" cy="23.5" r="4.5" fill="#14B8A6">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="18.5" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.7">CI / CD</text>
      <text x="34" y="35.5" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">GitHub + Render</text>
    </g>

  <!-- Right Column: Animated 4-Node Architecture Panel (x=816..1168, y=24..304) -->
  <rect x="816" y="24" width="352" height="280" rx="14" fill="#090E1A" fill-opacity="0.78" stroke="#1E293B" stroke-width="1.2"/>
  
    <g transform="translate(834, 42)">
      <rect width="316" height="42" rx="9" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
